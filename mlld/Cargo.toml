[package]
name = "mlld"
version = "0.0.0"
edition = "2024"

[dependencies]
mll-core = { path = "../mll-core", features = ["tokio"] }

clap = { version = "4", features = ["cargo", "env"] }

serde_json = "1"
toml = "1"

tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
interprocess = { version = "2", features = ["tokio"] }

nix = { version = "0.31", features = ["signal"] }
